<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Noob Araba Çarpışma</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial;overflow:hidden}
#game{display:block;width:100vw;height:100dvh;background:#7cc7ef;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#101827d9;padding:8px 12px;border-radius:12px;font-weight:800;box-shadow:0 2px 8px #0004}
#msg{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#101827df;padding:8px 12px;border-radius:10px;text-align:center;font-size:13px;max-width:90vw}
.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;align-items:end;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:66px;height:66px;border:2px solid #ffffffb0;border-radius:18px;background:#101827d9;color:white;font-size:26px;font-weight:900;touch-action:none;box-shadow:0 4px 0 #0005}
#gas{height:82px;width:82px;background:#16803d;font-size:18px}#brake{background:#b42323;font-size:15px}
#reset{position:fixed;top:58px;right:10px;border:0;border-radius:10px;padding:8px 12px;background:#f4b942;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">🏁 NOOB ARABA</div><div class="pill">Hız: <span id="speed">0</span> km/sa</div><div class="pill">Hasar: <span id="damage">0</span>%</div></div>
<div id="msg">Gazla ilerle • ◀ ▶ ile dön • Engellere çarpma!</div>
<button id="reset">YENİDEN BAŞLAT ↻</button>
<div class="controls">
 <div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="pad"><button class="ctrl" id="brake">FREN</button><button class="ctrl" id="gas">GAZ</button></div>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,dpr,car,obstacles,roadOffset,damage,crashFlash;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const keys={left:false,right:false,gas:false,brake:false};
function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{keys[key]=false})}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
function reset(){car={x:0,speed:0,steer:0};obstacles=[];roadOffset=0;damage=0;crashFlash=0;for(let i=0;i<7;i++)obstacles.push({x:(Math.random()*1.5-.75),z:220+i*190,type:Math.random()<.5?'barrel':'car'})}
document.getElementById('reset').onclick=reset;reset();
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,w,h,color,player=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#111827';ctx.fillRect(-w*.52,-h*.30,w*.18,h*.27);ctx.fillRect(w*.34,-h*.30,w*.18,h*.27);ctx.fillRect(-w*.52,h*.12,w*.18,h*.27);ctx.fillRect(w*.34,h*.12,w*.18,h*.27);roundRect(-w/2,-h/2,w,h,Math.max(5,w*.12),color);roundRect(-w*.31,-h*.28,w*.62,h*.28,5,player?'#a7e7ff':'#b9e3f5');ctx.fillStyle='#fef3c7';ctx.fillRect(-w*.38,-h*.48,w*.18,h*.07);ctx.fillRect(w*.20,-h*.48,w*.18,h*.07);ctx.fillStyle='#ef4444';ctx.fillRect(-w*.36,h*.39,w*.19,h*.07);ctx.fillRect(w*.17,h*.39,w*.19,h*.07);ctx.restore()}
function frame(){
let dt=1/60;
if(keys.gas)car.speed=Math.min(220,car.speed+90*dt);else car.speed=Math.max(0,car.speed-22*dt);
if(keys.brake)car.speed=Math.max(0,car.speed-170*dt);
if(keys.left)car.x-=dt*(.85+car.speed/150);if(keys.right)car.x+=dt*(.85+car.speed/150);
car.x=Math.max(-1.18,Math.min(1.18,car.x));roadOffset=(roadOffset+car.speed*dt)%80;
ctx.clearRect(0,0,W,H);
let sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#6cc8f5');sky.addColorStop(1,'#e4f8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#6eae56';ctx.fillRect(0,H*.39,W,H*.61);
let horizon=H*.39,roadTop=W*.12,roadBottom=W*.92;
ctx.fillStyle='#3b414b';ctx.beginPath();ctx.moveTo(W/2-roadTop/2,horizon);ctx.lineTo(W/2+roadTop/2,horizon);ctx.lineTo(W/2+roadBottom/2,H);ctx.lineTo(W/2-roadBottom/2,H);ctx.closePath();ctx.fill();
ctx.strokeStyle='#f8fafc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2-roadTop/2,horizon);ctx.lineTo(W/2-roadBottom/2,H);ctx.moveTo(W/2+roadTop/2,horizon);ctx.lineTo(W/2+roadBottom/2,H);ctx.stroke();
for(let i=0;i<12;i++){let z=(i*80+roadOffset)%900;let p=z/900;let y=horizon+p*p*(H-horizon);let rw=roadTop/2+p*p*(roadBottom/2-roadTop/2);let dashH=3+p*20;ctx.fillStyle='#fef3c7';ctx.fillRect(W/2-2,y-dashH/2,4+p*3,dashH)}
// roadside cones/trees
for(let i=0;i<10;i++){let z=(i*100+roadOffset*1.7)%900,p=z/900,y=horizon+p*p*(H-horizon),rw=roadTop/2+p*p*(roadBottom/2-roadTop/2);for(let side of [-1,1]){let x=W/2+side*(rw+12+p*22);ctx.fillStyle='#754c24';ctx.fillRect(x-3*p,y-12*p,6*p,15*p);ctx.fillStyle='#176b3b';ctx.beginPath();ctx.arc(x,y-17*p,12*p+2,0,Math.PI*2);ctx.fill()}}
for(const o of obstacles){o.z-=car.speed*dt;if(o.z<0){o.z=950+Math.random()*300;o.x=Math.random()*1.6-.8;o.type=Math.random()<.5?'barrel':'car'}let p=1-o.z/1000;if(p<0||p>1)continue;let y=horizon+p*p*(H-horizon),rw=roadTop/2+p*p*(roadBottom/2-roadTop/2),x=W/2+o.x*rw*.83,size=10+p*45;if(o.type==='car')drawCar(x,y-size*.2,size*.8,size*1.4,['#f97316','#a855f7','#eab308'][Math.floor(o.z)%3]);else{ctx.fillStyle='#b45309';ctx.fillRect(x-size*.35,y-size,size*.7,size*1.5);ctx.fillStyle='#fbbf24';ctx.fillRect(x-size*.35,y-size*.2,size*.7,size*.2)}
if(o.z<38&&o.z>0&&Math.abs(o.x-car.x)<.25){damage=Math.min(100,damage+1.8);car.speed*=.91;crashFlash=8;o.z=1050;document.getElementById('msg').textContent='💥 ÇARPIŞMA! Dikkatli sür!';}
}
let playerX=W/2+car.x*(roadBottom/2)*.83,playerY=H*.82;drawCar(playerX,playerY,Math.min(76,W*.18),Math.min(120,H*.16),'#e11d48',true);
if(crashFlash>0){ctx.fillStyle='rgba(255,70,30,.18)';ctx.fillRect(0,0,W,H);crashFlash--}
document.getElementById('speed').textContent=Math.round(car.speed);document.getElementById('damage').textContent=Math.round(damage);
if(damage>=100){car.speed=0;document.getElementById('msg').textContent='🚧 Araba çok hasar aldı! Yeniden başlat ↻'}
requestAnimationFrame(frame)
}
frame();
})();
</script>
</body>
</html>
